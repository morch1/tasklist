services:
  tasklist:
    build: .
    image: tasklist
    container_name: tasklist
    environment:
      # IP the server binds to inside the container.
      BIND_IP: ${BIND_IP:-0.0.0.0}
      # Port the server listens on inside the container.
      PORT: ${PORT:-8234}
    ports:
      # Publish the same port on the host. Override via a .env file or shell:
      #   PORT=9000 docker compose up
      - "${PORT:-8234}:${PORT:-8234}"
    restart: unless-stopped
