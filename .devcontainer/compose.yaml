services:
  devcontainer:
    image: morchv/pi-box:latest
    environment:
      - TERM
      - LOCAL_LLM_API_KEY
      - FIRECRAWL_API_KEY
      - FIRECRAWL_API_URL
    command: sleep infinity
    working_dir: /workspace/${COMPOSE_PROJECT_NAME}
    volumes:
      - ..:/workspace/${COMPOSE_PROJECT_NAME}
      - ${DEVCONTAINER_HOME:-${HOME}/.devcontainers-home}:/home/dev
      - /home/dev/.vscode-server

  dev-nginx:
    image: nginx:1.27-alpine
    environment:
      BIND_IP: 0.0.0.0
      PORT: 8234
    ports:
      - "8234:8234"
    volumes:
      - ../docker/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ..:/usr/share/nginx/html:ro
