services:
  devcontainer:
    image: ${PI_BOX_IMAGE:-morchv/pi-box:latest}
    env_file:
      - path: ${PI_BOX_ENV_FILE:-${PI_BOX_ROOT:-${HOME}/.pi-box}/pi-box.env}
        required: false
    command: sleep infinity
    working_dir: /workspace/${COMPOSE_PROJECT_NAME}
    volumes:
      - ..:/workspace/${COMPOSE_PROJECT_NAME}
      - ${PI_BOX_HOME:-${PI_BOX_ROOT:-${HOME}/.pi-box}/home}:/home/dev
      - /home/dev/.vscode-server
